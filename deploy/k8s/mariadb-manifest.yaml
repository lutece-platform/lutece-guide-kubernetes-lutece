# Base MariaDB du site. La base "core" et l'utilisateur "lutece" sont créés par l'image au premier démarrage ;
# les tables sont créées par Liquibase au démarrage de Lutece.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-credentials
type: Opaque
stringData:
  db-user: lutece
  db-password: some_password
  db-rootpassword: rootpassword
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          args:
            # Lutece écrit et lit des dates sans fuseau : le serveur de base et les pods Lutece restent sur le même (UTC)
            - --default-time-zone=+00:00
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: db-rootpassword
            - name: MARIADB_DATABASE
              value: core
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: db-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: db-password
          ports:
            - containerPort: 3306
              name: mariadb
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # Requêtes lourdes du back office (multivue, exports) : environ 40 Mo chacune ; 512 Mi ne suffisent pas
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  ports:
    - port: 3306
  selector:
    app: mariadb
