# Ingress (ingress-nginx, addon "ingress" de minikube), avec affinité de session : la session HTTP est partagée (un pod
# perdu, ses usagers continuent sur l'autre), mais une requête qui suit une redirection peut arriver sur l'autre pod avant
# que la session soit écrite (actions du back office), et rester sur un pod coûte moins de CPU (README). Accès : http://lutece.local/lutece/ (ajouter "<minikube ip> lutece.local" dans /etc/hosts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lutece
  annotations:
    # Rejouer une requête sur un autre pod UNIQUEMENT quand la connexion au pod a échoué (pod tué, endpoint pas encore
    # retiré). Jamais non_idempotent : un POST déjà envoyé (étape de formulaire, action de workflow) ne doit pas être rejoué.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "10"
    # Délai de connexion court : c'est lui qui borne une bascule après l'arrêt brutal d'un pod (mesuré : p99 2,5 s avec
    # 2 s, 37 s avec 60 s)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2"
    # Pièces jointes des formulaires
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # Au-dessus de la page la plus longue (multivue, export PDF)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Affinité de session par un cookie de l'ingress, jamais nommé JSESSIONID (celui d'Open Liberty) ; balanced : un pod
    # ajouté reçoit les nouveaux usagers
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: balanced
    nginx.ingress.kubernetes.io/session-cookie-name: lutece-route
spec:
  ingressClassName: nginx
  rules:
    - host: lutece.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lutece-service
                port:
                  name: http
