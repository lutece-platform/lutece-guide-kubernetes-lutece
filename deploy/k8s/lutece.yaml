# Réplicas du site : session HTTP et cache Lutece dans Hazelcast (un membre par pod).
# Ordre : mariadb-manifest.yaml, lutece-base.yaml, lutece-migration.yaml (migrations Liquibase depuis un seul pod), puis
# ce fichier. Liquibase est désactivé sur les réplicas (JVM_ARGS) : avant chaque nouvelle image, relancer la migration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lutece-deployment
  labels:
    app: lutece
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Un pod de plus pendant la mise à jour, jamais un de moins
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: lutece
  template:
    metadata:
      labels:
        app: lutece
    spec:
      serviceAccountName: lutece
      # Au-dessus du preStop (10 s) + hazelcast.graceful.shutdown.max.wait (45 s)
      terminationGracePeriodSeconds: 60
      securityContext:
        # OpenLiberty tourne en utilisateur 1001, groupe 0 : le groupe 0 écrit sur le volume partagé
        fsGroup: 0
      # Attendre MariaDB : démarré avant elle, Lutece échoue à ouvrir sa base (Liquibase, puis la webapp) et le pod reste
      # non prêt jusqu'à ce que la sonde de démarrage le tue (10 min). Même image que la base : rien de plus à télécharger.
      # --skip-ssl : le client MariaDB 11 refuse le certificat auto-signé du serveur ; ping ne transmet aucune donnée.
      initContainers:
        - name: wait-for-mariadb
          image: mariadb:11.8
          command: ["sh", "-c", "until mariadb-admin ping -h mariadb-service --skip-ssl --silent; do echo waiting for mariadb-service; sleep 2; done"]
      containers:
        - name: lutece-container
          image: lutece-guide-kubernetes:multi-1.0.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
            - name: hazelcast
              containerPort: 5701
          env:
            - name: MP_CONFIG_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: lutece-config
                  key: mp_config_profile
            # Variables portal.* de server.xml
            - name: PORTAL_SERVERNAME
              value: mariadb-service
            - name: PORTAL_DBNAME
              value: core
            - name: PORTAL_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-user
            - name: PORTAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-password
            # Liquibase depuis un seul pod (lutece-migration.yaml) ; index Forms sur le volume partagé
            - name: JVM_ARGS
              value: "-Dliquibase.enabled.at.startup=false -Dforms.internalIndexer.lucene.indexPath=/opt/data/lucene/plugins/forms/index"
            # Télémétrie vers la suite LGTM (deploy/k8s/lgtm.yaml) ; sans endpoint joignable, laisser à true
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: lutece-guide
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm:4317
          resources:
            requests:
              cpu: "1"
              memory: 1536Mi
            # Limite CPU au-dessus de la request : la compilation JIT d'OpenJ9 occupe environ un tiers de 2 CPU pendant
            # les premières minutes sous charge. executor.threads (server.xml) suit la limite : 4 threads pour 2 CPU.
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            periodSeconds: 5
            failureThreshold: 36
            # 1 s par défaut : dépassé quand deux réplicas démarrent ensemble
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
            # La liveness détecte un pod figé, pas un pod lent : avec 1 s, le pod resté seul avec toute la charge après
            # la perte de l'autre était tué à son tour
            timeoutSeconds: 10
          lifecycle:
            # Sortir du Service avant l'arrêt d'OpenLiberty
            preStop:
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            - name: lucene
              mountPath: /opt/data/lucene
      volumes:
        - name: lucene
          persistentVolumeClaim:
            claimName: lutece-lucene