# Même site qu'avec deploy/k8s/lutece.yaml, déployé par l'Open Liberty Operator. À appliquer après
# deploy/k8s/mariadb-manifest.yaml, à la place de deploy/k8s/lutece.yaml (pas les deux à la fois).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  db-user: lutece
  db-password: some_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lutece-config
data:
  mp_config_profile: dev
---
apiVersion: apps.openliberty.io/v1
kind: OpenLibertyApplication
metadata:
  name: lutece
  labels:
    name: lutece
spec:
  applicationImage: lutece-guide-kubernetes:1.0.0-SNAPSHOT
  pullPolicy: IfNotPresent
  # Une seule instance : cache Ehcache local à la JVM
  replicas: 1
  # HTTP : le serveur n'active pas TLS (pas de feature transportSecurity) ; le TLS se termine à la route ou à l'ingress
  service:
    port: 9090
  expose: true
  route:
    pathType: ImplementationSpecific
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 1536Mi
  env:
    - name: WLP_LOGGING_MESSAGE_FORMAT
      value: "json"
    - name: WLP_LOGGING_MESSAGE_SOURCE
      value: "message,trace,accessLog,ffdc,audit"
    - name: MP_CONFIG_PROFILE
      valueFrom:
        configMapKeyRef:
          name: lutece-config
          key: mp_config_profile
    - name: PORTAL_SERVERNAME
      value: mariadb-service
    - name: PORTAL_DBNAME
      value: core
    - name: PORTAL_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: db-user
    - name: PORTAL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: db-password
  probes:
    startup:
      httpGet:
        path: /health/started
        port: 9090
      periodSeconds: 5
      # 10 min : Liquibase crée ou migre les tables au démarrage
      failureThreshold: 120
      timeoutSeconds: 5
    readiness:
      httpGet:
        path: /health/ready
        port: 9090
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      httpGet:
        path: /health/live
        port: 9090
      periodSeconds: 10
      failureThreshold: 6
      timeoutSeconds: 10
