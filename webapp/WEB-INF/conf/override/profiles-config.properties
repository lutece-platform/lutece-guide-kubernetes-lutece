# Configuration propre au site (ordinal 250, au-dessus des .properties du core et des plugins).
#
# Profils MicroProfile Config : le profil actif vient de la variable d'environnement MP_CONFIG_PROFILE (ConfigMap
# lutece-config du déploiement). Une clé préfixée %<profil>. ne s'applique qu'avec ce profil.

#Profil dev
%dev.daemon.indexer.onstartup=0
%dev.daemon.temporaryfilesDaemon.days.defore.delete=1

#Profil rec
%rec.daemon.indexer.onstartup=1
%rec.daemon.temporaryfilesDaemon.days.defore.delete=5

#Profil prod
%prod.daemon.indexer.onstartup=1
%prod.daemon.temporaryfilesDaemon.days.defore.delete=7

#Tous les profils
lutece.name=lutece

#-------------------------------------------------------------------------------
# Base de données : tables créées et mises à jour par Liquibase au démarrage (une seule instance)
# La source de données jdbc/portal est déclarée dans src/main/liberty/config/server.xml.
#-------------------------------------------------------------------------------
liquibase.enabled.at.startup=true
# Scripts des versions beta et SNAPSHOT de la plateforme
liquibase.accept.unstable.versions=true
liquibase.accept.snapshot.versions=true

#-------------------------------------------------------------------------------
# Notifications GRU (forms-starter) : aucun service de notification dans ce guide
#-------------------------------------------------------------------------------
library-notifygru.notifier.email.enabled=false
library-notifygru.notifier.broadcastEmail.enabled=false
library-notifygru.notifier.statistics.enabled=false
library-notifygru.notifier.notificationStore.enabled=false

#-------------------------------------------------------------------------------
# Cache Lutece : Ehcache, local à la JVM (une seule instance). Les valeurs par défaut du core conviennent
# (10 000 entrées par cache, durée de vie 3600 s, pas de niveau offheap). Une valeur propre à un cache :
#   core.cache.status.<nom du cache>.maxElementsInMemory=...
#   core.cache.status.<nom du cache>.timeToLiveSeconds=...
# Ne pas utiliser timeToIdleSeconds : chaque lecture réécrit l'expiration (+19 % de CPU mesuré).
#-------------------------------------------------------------------------------
