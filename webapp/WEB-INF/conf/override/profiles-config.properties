# Configuration propre au site (ordinal 250, au-dessus des .properties du core et des plugins).
#
# Profils MicroProfile Config : le profil actif vient de la variable d'environnement MP_CONFIG_PROFILE (ConfigMap
# lutece-config du déploiement). Une clé préfixée %<profil>. ne s'applique qu'avec ce profil.

#Profil dev
%dev.daemon.indexer.onstartup=0
%dev.daemon.temporaryfilesDaemon.days.defore.delete=1

#Profil rec
%rec.daemon.indexer.onstartup=1
%rec.daemon.temporaryfilesDaemon.days.defore.delete=5

#Profil prod
%prod.daemon.indexer.onstartup=1
%prod.daemon.temporaryfilesDaemon.days.defore.delete=7

#Tous les profils
lutece.name=lutece

#-------------------------------------------------------------------------------
# Base de données : tables créées et mises à jour par Liquibase, depuis un seul pod.
# Les réplicas démarrent avec -Dliquibase.enabled.at.startup=false (JVM_ARGS de deploy/k8s/lutece.yaml, une propriété
# système l'emporte sur ce fichier) ; deploy/k8s/lutece-migration.yaml lance les migrations avant eux.
# La valeur true ci-dessous sert au démarrage local (mvn liberty:run -Dlocal).
# La source de données jdbc/portal est déclarée dans src/main/liberty/config/server.xml.
#-------------------------------------------------------------------------------
liquibase.enabled.at.startup=true
# Scripts des versions beta et SNAPSHOT de la plateforme
liquibase.accept.unstable.versions=true
liquibase.accept.snapshot.versions=true

#-------------------------------------------------------------------------------
# Notifications GRU (forms-starter) : aucun service de notification dans ce guide
#-------------------------------------------------------------------------------
library-notifygru.notifier.email.enabled=false
library-notifygru.notifier.broadcastEmail.enabled=false
library-notifygru.notifier.statistics.enabled=false
library-notifygru.notifier.notificationStore.enabled=false

#-------------------------------------------------------------------------------
# Cache Lutece : Hazelcast (cluster.xml), partagé par tous les réplicas. Le provider JCache n'est pas défini ici : il
# dépend du mode d'exécution (cluster.xml en conteneur, Ehcache du core avec mvn liberty:run -Dlocal).
# Durée de vie et taille de chaque cache viennent de Lutece (taille appliquée par library-cache-hazelcast, à la création
# du cache dans le cluster : une nouvelle taille demande l'arrêt de tous les réplicas). Une valeur propre à un cache :
#   core.cache.status.<nom du cache>.maxElementsInMemory=...
# Une donnée modifiée hors Lutece (SQL, restauration) reste en cache jusqu'à sa durée de vie + celle du near cache
# (600 s) : vider les caches depuis le back office (Système > Gestion des caches), qui agit sur tout le cluster.
#-------------------------------------------------------------------------------

#-------------------------------------------------------------------------------
# Index Lucene des réponses Forms, partagé par les réplicas (volume ReadWriteMany, chemin donné par JVM_ARGS) : le
# contrôle d'accès du back office à une réponse cherche dans cet index.
#-------------------------------------------------------------------------------
forms.internalIndexer.lucene.indexInWebapp=false
# Bail du verrou d'écriture de l'index (ms), renouvelé au tiers de sa durée pendant l'indexation. 15 min par défaut :
# un réplica arrêté sans le rendre bloquerait l'indexation de toutes les réponses jusqu'à son expiration.
forms.index.writer.ms.timeout.lock=120000

#-------------------------------------------------------------------------------
# Daemons : planificateur Quartz en cluster (plugin-quartz-scheduler, tables qrtz_* en base).
# Désactivé par défaut dans le plugin : sans cette ligne, les daemons déclarés exclusifs tournent sur chaque réplica.
#-------------------------------------------------------------------------------
quartzscheduler.cluster.enable=true
# Daemons exécutés par un seul réplica : quartzscheduler.daemon.<daemon-id>.disallowedClusterConcurrentExecution=true
# <daemon-id> est la balise du descripteur (WEB-INF/conf/core.xml, WEB-INF/plugins/<plugin>.xml). Un id faux est
# ignoré sans erreur : le daemon tourne alors sur tous les réplicas. Liste du war :
#   grep -ho "<daemon-id>[^<]*" target/lutece-guide-kubernetes-*/WEB-INF/conf/core.xml target/lutece-guide-kubernetes-*/WEB-INF/plugins/*.xml
# core : envoi des mails, comptes administrateurs
quartzscheduler.daemon.mailSender.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.accountLifeTimeDaemon.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.anonymizationDaemon.disallowedClusterConcurrentExecution=true
# forms : indexation des réponses dans l'index partagé, purge des brouillons
quartzscheduler.daemon.formsIndexerDaemon.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.formsBackupPurgeDaemon.disallowedClusterConcurrentExecution=true
# workflow : actions automatiques, archivage, changement et choix d'état (en double, les tâches sont répétées)
quartzscheduler.daemon.automaticActionDaemon.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.archiveDaemon.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.changeStateDaemon.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.chooseStateActionDaemon.disallowedClusterConcurrentExecution=true
# workflow-notifygru : purge de l'historique des notifications
quartzscheduler.daemon.notifyHistoryCleanerDaemon.disallowedClusterConcurrentExecution=true
# accesscontrol : purge des codes d'accès expirés ; filegenerator : purge des fichiers générés (en base)
quartzscheduler.daemon.userControllerCodeDataDaemon.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.temporaryfilesDaemon.disallowedClusterConcurrentExecution=true
# Laissés sur chaque réplica : indexer (core, index de recherche propre à chaque pod) et threadLauncherDaemon
# (file de tâches en mémoire du pod).
